# 발표 앱을 GitHub Pages 에 배포한다.
#
# 이 워크플로가 도는 조건:
#   저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔 둬야 한다.
#   (기본값인 "Deploy from a branch" 로 두면 이 워크플로의 배포 단계가 실패한다)
#
# 배포되는 주소
#   대시보드      https://lsthc.github.io/Living-Alone/
#   학부모 안내   https://lsthc.github.io/Living-Alone/welcome.html
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로도 돌릴 수 있게 (발표 직전 재배포용)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 발표 직전에 여러 번 밀어 넣어도 마지막 것만 배포되게 한다.
# 진행 중인 배포는 취소하지 않는다 (반쯤 올라간 상태로 남으면 발표장에서 복구할 수 없다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 가설 판정 함수 테스트
        # 판정이 깨진 채로 배포되지 않게 한다. 이 앱의 결론은 코드가 계산한다.
        run: npm test

      # 학부모 안내 페이지의 숫자는 CSV 에서 계산한다. 손으로 적은 값이 아니므로
      # 배포할 때마다 다시 만들어 데이터와 어긋나지 않게 한다.
      # 글꼴 서브셋(pyftsubset)이 없으면 스크립트가 알아서 건너뛰고 HTML 만 갱신한다.
      - name: 글꼴 서브셋 도구 설치
        run: pip install "fonttools[woff]" brotli

      - name: 학부모 안내 페이지 생성
        run: npm run welcome:build

      - name: 빌드
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
